<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="18%" cy="8%" r="75%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0b" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- logo -->
  <g transform="translate(80,72)">
    <rect width="34" height="34" rx="8" fill="#111113" stroke="#27272a" />
    <g transform="translate(5,5)" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 19h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" />
      <path d="M12.5 5.5l4 4" />
      <path d="M4.5 13.5l4 4" />
      <path d="M21 15v4h-8l4 -4l4 0" />
    </g>
    <text x="46" y="26" font-family="monospace" font-size="26" font-weight="500" fill="#f4f4f5">style<tspan fill="#3b82f6">&#183;</tspan>doctor</text>
  </g>

  <!-- headline -->
  <text x="80" y="230" font-family="sans-serif" font-size="56" font-weight="600" fill="#f4f4f5">Find the AI</text>
  <text x="80" y="298" font-family="sans-serif" font-size="56" font-weight="600" fill="#f4f4f5">in your writing.</text>
  <text x="80" y="352" font-family="sans-serif" font-size="21" fill="#a1a1aa">Paste text, get every LLM tell highlighted live.</text>
  <text x="80" y="382" font-family="sans-serif" font-size="21" fill="#a1a1aa">Runs in your browser &#8212; nothing is sent anywhere.</text>

  <!-- mock diagnostics card -->
  <g transform="translate(700,110)">
    <rect width="420" height="410" rx="14" fill="#131316" stroke="#27272a" />

    <text x="24" y="52" font-family="monospace" font-size="40" font-weight="600" fill="#f87171">62</text>
    <text x="70" y="52" font-family="sans-serif" font-size="16" fill="#71717a">/ 100</text>
    <text x="24" y="76" font-family="sans-serif" font-size="14" fill="#71717a">Needs work &#183; 4 findings</text>

    <line x1="0" y1="98" x2="420" y2="98" stroke="#27272a" />

    <g font-family="sans-serif" font-size="15">
      <g transform="translate(24,132)">
        <circle cx="4" cy="-5" r="4" fill="#f87171" />
        <text x="18" fill="#f4f4f5">Filler word &#8220;delve&#8221;</text>
        <text x="18" y="22" font-family="monospace" font-size="12" fill="#71717a">style-doctor/delve</text>
      </g>
      <g transform="translate(24,192)">
        <circle cx="4" cy="-5" r="4" fill="#fbbf24" />
        <text x="18" fill="#f4f4f5">&#8220;Not just X, but Y&#8221; construction</text>
        <text x="18" y="22" font-family="monospace" font-size="12" fill="#71717a">style-doctor/not-just-but</text>
      </g>
      <g transform="translate(24,252)">
        <circle cx="4" cy="-5" r="4" fill="#fbbf24" />
        <text x="18" fill="#f4f4f5">&#8220;Tapestry&#8221; metaphor</text>
        <text x="18" y="22" font-family="monospace" font-size="12" fill="#71717a">style-doctor/tapestry</text>
      </g>
      <g transform="translate(24,312)">
        <circle cx="4" cy="-5" r="4" fill="#fbbf24" />
        <text x="18" fill="#f4f4f5">Marketing filler &#8220;seamless&#8221;</text>
        <text x="18" y="22" font-family="monospace" font-size="12" fill="#71717a">style-doctor/seamless</text>
      </g>
    </g>

    <line x1="0" y1="352" x2="420" y2="352" stroke="#27272a" />
    <text x="24" y="384" font-family="monospace" font-size="13" fill="#52525b">$ npx style-doctor --scope changed</text>
  </g>
</svg>
